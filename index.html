anxious:{emp:['It\u2019s hard to relax when something is on your mind.','Thank you for telling me.'],ask:['What is bothering you the most?','Since when has this worry been with you?'],deep:['Can it be decided tonight, or is it for tomorrow and later?','What do you think is the most likely way it will go?','What would you like to say to yourself right now?']},
angry:{emp:['That would make me angry too.','There must be a reason behind that anger.'],ask:['What felt the hardest to accept?','What did you really want them to understand?'],deep:['What important thing might be behind that anger?','Why do you think it bothered you so much?','If you take one deep breath, do the words change a little?']},
lonely:{emp:['A night alone can feel too quiet.','Thank you for telling me. I\u2019m here with you now.'],ask:['When did you start feeling that way?','If you could hear someone\u2019s voice now, whose would it be?'],deep:['What do you think this loneliness is asking for?','Is there a small way to connect with someone tomorrow?','Tell me a little more about that moment.']},
calm:{emp:['So you had a peaceful moment.','That sounds like a good night.'],ask:['Where do you think that calm came from?','What were you thinking about in that quiet?'],deep:['What would you need to feel that calm again?','Why do you think it came to you today?','Tell me a little more about that time.']}
}}};
const ORDER=['sad','anxious','angry','lonely','tired','happy','calm'];
let lang='en',msgs=[],cur='neutral',busy=false,hinted=false,toastT=null;
const $=s=>document.querySelector(s);
const chat=$('#chat');
function initLang(){
  let l=null;
  if(window.APP_LANG==='ja'||window.APP_LANG==='en')l=window.APP_LANG;
  if(!l){try{const q=new URLSearchParams(location.search).get('lang');if(q==='ja'||q==='en')l=q}catch(e){}}
  if(!l){try{const s=localStorage.getItem('lang');if(s==='ja'||s==='en')l=s}catch(e){}}
  lang=l||'en';
}
const T=()=>I18N[lang];
function fmt(s,o){return s.replace(/\{(\w+)\}/g,(_,k)=>o[k])}
function save(){try{localStorage.setItem('dusktalk_v1',JSON.stringify({msgs,cur}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem('dusktalk_v1')||'null');if(d&&Array.isArray(d.msgs)&&d.msgs.length){msgs=d.msgs;cur=MM[d.cur]?d.cur:'neutral'}}catch(e){}}
function buildSky(){
  const sky=$('#sky'),st=$('#stars');
  MOODS.forEach(m=>{const d=document.createElement('div');d.className='sky-layer';d.id='sky-'+m.id;d.style.background=`linear-gradient(180deg,${m.c[0]},${m.c[1]} 58%,${m.c[2]})`;sky.insertBefore(d,st)});
}
function setSky(id){
  cur=id;const m=MM[id];
  MOODS.forEach(x=>$('#sky-'+x.id).classList.toggle('on',x.id===id));
  $('#stars').style.opacity=m.st;$('#orb').textContent=m.orb;
  updatePill();
}
function updatePill(){
  const m=MM[cur],n=T().mood[cur];
  $('#pillText').textContent=m.orb+' '+fmt(T().skyLabel,{m:n[0],s:n[1]});
}
function renderLegend(){
  const lg=$('#lg');lg.innerHTML='';
  MOODS.forEach(m=>{
    const b=document.createElement('button');b.type='button';b.setAttribute('data-demo','legend-'+m.id);
    const sw=document.createElement('span');sw.className='sw';sw.style.background=`linear-gradient(180deg,${m.c[0]},${m.c[2]})`;
    const t=document.createElement('span');const n=T().mood[m.id];t.textContent=m.face+' '+n[0]+'＝'+n[1];
    b.append(sw,t);b.onclick=()=>setSky(m.id);lg.appendChild(b);
  });
}
function renderStarters(){
  const box=$('#starters');box.innerHTML='';
  if(msgs.some(m=>m.r==='u'))return;
  T().starters.forEach((s,i)=>{
    const b=document.createElement('button');b.type='button';b.textContent=s;b.setAttribute('data-demo','starter-'+(i+1));
    b.onclick=()=>send(s);box.appendChild(b);
  });
}
function mkRow(cls){const r=document.createElement('div');r.className='row '+cls;return r}
function buildNode(m){
  const d=T();
  if(m.r==='u'){const r=mkRow('user');const b=document.createElement('div');b.className='bubble user';b.textContent=m.t;r.appendChild(b);return r}
  if(m.r==='g'){const r=mkRow('bot');const b=document.createElement('div');b.className='bubble bot';b.textContent=d.greet;r.appendChild(b);return r}
  if(m.r==='b'){
    const r=mkRow('bot');const c=document.createElement('div');c.className='chip';
    c.textContent=MM[m.mood].face+' '+fmt(d.sensed,{m:d.mood[m.mood][0]});
    const p=d.rp[m.mood];const b=document.createElement('div');b.className='bubble bot';
    const q=(m.deep?p.deep:p.ask);
    b.textContent=p.emp[m.e%p.emp.length]+(lang==='ja'?'':' ')+q[m.q%q.length];
    r.append(c,b);return r;
  }
  if(m.r==='s'){
    const r=mkRow('bot');const mo=MM[m.dom];const card=document.createElement('div');card.className='card';card.setAttribute('data-demo','summary-card');
    const strip=document.createElement('div');strip.className='strip';strip.style.background=`linear-gradient(135deg,${mo.c[0]},${mo.c[1]},${mo.c[2]})`;
    const sb=document.createElement('b');sb.textContent=d.sumTitle+'：'+d.mood[m.dom][1];const ss=document.createElement('span');ss.textContent=mo.orb;strip.append(sb,ss);
    const body=document.createElement('div');body.className='body';
    const h=document.createElement('h3');h.textContent=d.sumMoods;
    const mc=document.createElement('div');mc.className='mchips';
    m.counts.forEach(([id,n])=>{const e=document.createElement('em');e.textContent=MM[id].face+' '+d.mood[id][0]+' ×'+n;mc.appendChild(e)});
    const p1=document.createElement('p');p1.textContent=d.close[m.dom];
    const nt=document.createElement('div');nt.className='note';
    const h2=document.createElement('h3');h2.textContent=d.sumTmr;const p2=document.createElement('p');p2.style.margin='0';p2.textContent=d.tmr[m.dom];nt.append(h2,p2);
    const p3=document.createElement('p');p3.style.cssText='margin:12px 0;color:#6b5a85;font-size:13px';p3.textContent=fmt(d.sumTalked,{n:m.n})+' '+d.sumGood+' 🌙';
    const nb=document.createElement('button');nb.type='button';nb.className='cbtn';nb.textContent=d.sumNew;nb.setAttribute('data-demo','summary-new');nb.onclick=newNight;
    body.append(h,mc,p1,nt,p3,nb);card.append(strip,body);r.appendChild(card);return r;
  }
}
function scrollEnd(){chat.scrollTop=chat.scrollHeight}
function renderAll(){chat.innerHTML='';msgs.forEach(m=>chat.appendChild(buildNode(m)));scrollEnd();renderStarters()}
function append(m){msgs.push(m);chat.appendChild(buildNode(m));scrollEnd();save()}
function detect(text){
  const low=text.toLowerCase(),tok=low.split(/[^a-z']+/).filter(Boolean);
  let best='neutral',bs=0;
  ORDER.forEach(id=>{
    let s=0;
    KW[id].ja.forEach(k=>{if(low.includes(k))s++});
    KW[id].en.forEach(k=>{
      if(k.includes(' ')){if(low.includes(k))s++}
      else if(k.endsWith('$')){if(tok.includes(k.slice(0,-1)))s++}
      else if(tok.some(t=>t.startsWith(k)))s++;
    });
    if(s>bs){bs=s;best=id}
  });
  return best;
}
function toast(txt){
  const t=$('#toast');t.textContent=txt;clearTimeout(toastT);toastT=setTimeout(()=>{t.textContent=''},3800);
}
function showTyping(){
  const r=mkRow('bot typing');r.id='typing';const b=document.createElement('div');b.className='bubble bot';b.setAttribute('aria-label',T().typing);
  b.innerHTML='<i></i><i></i><i></i>';r.appendChild(b);chat.appendChild(r);scrollEnd();
}
function send(text){
  text=(text||'').trim();
  if(!text){toast(T().toastEmpty);return}
  if(busy)return;
  busy=true;$('#send').disabled=true;
  const mood=detect(text);
  append({r:'u',t:text,m:mood});setSky(mood);renderStarters();
  const n=msgs.filter(m=>m.r==='u').length;
  showTyping();
  setTimeout(()=>{
    const ty=$('#typing');if(ty)ty.remove();
    append({r:'b',mood:mood,e:text.length+n,q:text.length+n,deep:n>1});
    busy=false;$('#send').disabled=false;
    if(n>=3&&!hinted){hinted=true;toast(T().toastHint)}
    $('#msg').focus({preventScroll:true});
  },1100);
}
function wrapUp(){
  const us=msgs.filter(m=>m.r==='u');
  if(us.length<2){toast(T().toastMore);return}
  if(msgs.length&&msgs[msgs.length-1].r==='s')return;
  const c={};us.forEach(m=>{c[m.m]=(c[m.m]||0)+1});
  let ids=Object.keys(c);const non=ids.filter(i=>i!=='neutral');if(non.length)ids=non.concat(ids.filter(i=>i==='neutral'));
  const dom=ids.slice().sort((a,b)=>c[b]-c[a])[0];
  const counts=ids.map(i=>[i,c[i]]);
  setSky(dom);append({r:'s',counts:counts,dom:dom,n:us.length});
}
function newNight(){
  msgs=[{r:'g'}];hinted=false;busy=false;$('#send').disabled=false;
  const ty=$('#typing');if(ty)ty.remove();
  setSky('neutral');renderAll();save();toast(T().toastNew);
}
function applyI18N(){
  const d=T();document.documentElement.lang=lang;document.title=d.title;
  document.querySelectorAll('[data-i18n]').forEach(e=>{e.textContent=d[e.dataset.i18n]});
  document.querySelectorAll('[data-i18n-ph]').forEach(e=>{e.placeholder=d[e.dataset.i18nPh]});
  document.querySelectorAll('[data-i18n-aria]').forEach(e=>{e.setAttribute('aria-label',d[e.dataset.i18nAria])});
  $('#lj').classList.toggle('act',lang==='ja');$('#le').classList.toggle('act',lang==='en');
}
function setLang(l){
  lang=l;try{localStorage.setItem('lang',l)}catch(e){}
  applyI18N();updatePill();renderLegend();renderAll();$('#toast').textContent='';
}
initLang();buildSky();load();
if(!msgs.length)msgs=[{r:'g'}];
setSky(cur);applyI18N();renderLegend();renderAll();
$('#form').addEventListener('submit',e=>{e.preventDefault();const i=$('#msg'),v=i.value;if(!v.trim()){toast(T().toastEmpty);return}if(busy)return;i.value='';send(v)});
$('#langBtn').onclick=()=>setLang(lang==='ja'?'en':'ja');
$('#newBtn').onclick=newNight;
$('#wrapBtn').onclick=wrapUp;
$('#pill').onclick=()=>{const o=$('#legend').classList.toggle('open');$('#pill').setAttribute('aria-expanded',o)};
</script>
</body>
</html>
